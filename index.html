<title>Mi Rutina de Gym</title>
<style>
  :root{
    /* Catppuccin Latte-inspired (light), no blue */
    --bg:#e6e9ef;
    --bg-elev:#ffffff;
    --bg-elev-2:#eff1f5;
    --border:#ccd0da;
    --text:#4c4f69;
    --text-dim:#6c6f85;
    --accent:#8839ef;
    --accent-2:#ea76cb;
    --accent-grad:linear-gradient(135deg, var(--accent), var(--accent-2));
    --accent-dim:#f1e4fb;
    --baja:#40a02b;
    --baja-text:#ffffff;
    --media:#df8e1d;
    --media-text:#2b1a00;
    --alta:#d20f39;
    --alta-text:#ffffff;
    --danger:#d20f39;
    --radius:14px;
    --muscle-fill:#bcc0cc;
    --muscle-outline:#8c8fa1;
    --muscle-primary:#fe640b;
    --muscle-secondary:#f5926a;
    --muscle-tertiary:#f6d9cc;
    --top-wash:#f5e9fa;
    --grad-primary-a:#fe640b;
    --grad-primary-b:#d20f39;
    --grad-secondary-a:#ffb088;
    --grad-secondary-b:#f2795f;
  }
  :root[data-theme="dark"]{
    /* Catppuccin Mocha-inspired (dark), no blue */
    --bg:#181825;
    --bg-elev:#1e1e2e;
    --bg-elev-2:#313244;
    --border:#45475a;
    --text:#cdd6f4;
    --text-dim:#a6adc8;
    --accent:#cba6f7;
    --accent-2:#f5c2e7;
    --accent-dim:#362b4d;
    --baja:#a6e3a1;
    --baja-text:#0f2a0c;
    --media:#f9e2af;
    --media-text:#3a2b00;
    --alta:#f38ba8;
    --alta-text:#47101c;
    --danger:#f38ba8;
    --muscle-fill:#45475a;
    --muscle-outline:#6c7086;
    --muscle-primary:#fab387;
    --muscle-secondary:#f2a4ab;
    --muscle-tertiary:#4a3d3a;
    --top-wash:#241b33;
    --grad-primary-a:#fab387;
    --grad-primary-b:#f38ba8;
    --grad-secondary-a:#f9c8a0;
    --grad-secondary-b:#f2a4ab;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--top-wash) 0%, var(--bg) 420px);
    color:var(--text);
    transition:background-color .2s;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:76px;
    overscroll-behavior-y:none;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--top-wash), var(--bg));
    transition:background-color .2s;
    padding:14px 16px 0 16px;
    border-bottom:1px solid var(--border);
  }
  h1{
    font-size:19px;
    margin:0;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .theme-toggle{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-elev);
    color:var(--text);
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .theme-toggle:active{ opacity:.8; }
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-elev);
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--accent-grad);
    border-color:transparent;
    color:#fff;
  }
  main{ padding:16px; max-width:640px; margin:0 auto; }
  .day-title{
    font-size:15px;
    color:var(--text-dim);
    margin:2px 0 14px 0;
  }

  /* ---- Body diagram ---- */
  .body-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .bodies{
    display:flex;
    gap:22px;
    justify-content:center;
  }
  .body-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .body-label{
    font-size:10.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:600;
  }
  .body-svg{
    width:108px;
    height:auto;
    display:block;
  }
  .zone{
    fill:var(--muscle-fill);
    stroke:none;
    transition:fill .2s;
  }
  .zone.primary{ fill:url(#muscleGradPrimary); }
  .zone.secondary{ fill:url(#muscleGradSecondary); }
  .zone.tertiary{ fill:var(--muscle-tertiary); }
  .editable .zone{ cursor:pointer; }
  .structural{
    fill:var(--muscle-fill);
    stroke:var(--muscle-outline);
    stroke-width:1.4;
  }
  .ab-lines{
    stroke:var(--muscle-outline);
    stroke-width:1;
    opacity:.55;
    fill:none;
  }
  .legend{
    display:flex;
    gap:12px;
    font-size:10.5px;
    color:var(--text-dim);
    flex-wrap:wrap;
    justify-content:center;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .legend i{
    width:9px; height:9px;
    border-radius:3px;
    display:inline-block;
  }
  .legend i.primary{ background:linear-gradient(135deg, #fe640b, #d20f39); }
  .legend i.secondary{ background:linear-gradient(135deg, #ffb088, #f2795f); }
  .legend i.tertiary{ background:var(--muscle-tertiary); }
  .body-caption{
    text-align:center;
    min-height:44px;
  }
  .body-ex-name{
    font-size:14.5px;
    font-weight:700;
  }
  .body-muscles{
    font-size:12px;
    color:var(--text-dim);
    margin-top:3px;
    line-height:1.5;
  }
  .body-muscles b{ color:var(--text); font-weight:600; }

  .card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .card.active{
    border-color:var(--muscle-primary);
    box-shadow:0 0 0 1px var(--muscle-primary) inset;
  }
  .ex-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .ex-name{
    font-size:15.5px;
    font-weight:600;
  }
  .ex-actions{
    display:flex;
    gap:2px;
    flex:0 0 auto;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    line-height:1;
    padding:6px;
    cursor:pointer;
    border-radius:8px;
  }
  .icon-btn:active{ background:var(--bg-elev-2); }
  .row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
  }
  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:11.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  input[type=number], input[type=date], input[type=text]{
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    width:100%;
  }
  input[type=number]{ -moz-appearance:textfield; }
  .intensity{
    display:flex;
    gap:6px;
  }
  .int-btn{
    flex:1;
    padding:9px 4px;
    border-radius:10px;

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "gymTrackerData_v4";

  function slug(name){
    return name.toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }
  function cloneMuscles(m){
    return JSON.parse(JSON.stringify(m || { primary:[], secondary:[], tertiary:[] }));
  }

  var TIER_LABEL = { primary:"Principal", secondary:"Secundario", tertiary:"Terciario" };

  var ZONE_LABELS = {

    "forearms":"Antebrazo", "forearms2":"Antebrazo",

  var MUSCLE_MAP = {

    "press inclinado con mancuernas": { primary:["chest"], secondary:["shoulders-f","shoulders-f2"], tertiary:["triceps","triceps2"] },

    "curl femoral": { primary:["hamstrings","hamstrings2"], secondary:["glutes"] },
    "extensión de cuádriceps": { primary:["quads","quads2"] },
    "elevación de talones de pie": { primary:["calves-f","calves-f2","calves-b","calves-b2"] },
    "peso muerto": { primary:["hamstrings","hamstrings2","glutes"], secondary:["lower-back"], tertiary:["lats","traps"] },

    "press de hombros con mancuernas": { primary:["shoulders-f","shoulders-f2"], secondary:["triceps","triceps2"], tertiary:["traps"] },
    "press militar": { primary:["shoulders-f","shoulders-f2"], secondary:["triceps","triceps2"], tertiary:["traps"] },
    "elevaciones laterales": { primary:["shoulders-f","shoulders-f2"], secondary:["traps"] },

  };

  function mkEx(name, series, reps, intensity){
    return { id: slug(name), name: name, series: series, reps: reps, intensity: intensity, muscles: cloneMuscles(MUSCLE_MAP[name.toLowerCase()]) };

  var EXERCISE_LIBRARY = {

      mkEx("Elevaciones laterales", 3, 12, "media"),
      mkEx("Press Arnold", 3, 8, "media"),
      mkEx("Press en máquina", 3, 10, "media"),
      mkEx("Aperturas invertidas (pájaros)", 3, 13, "baja")
    ],
    "espalda-baja": [
      mkEx("Peso muerto", 3, 14, "alta"),
      mkEx("Extensión de espalda (hiperextensión)", 3, 12, "media")
    ]
  };

  var DAYS = [
    { id:"espalda-biceps", label:"Espalda alta y Bíceps" },
    { id:"pecho-triceps",  label:"Pecho y Tríceps" },
    { id:"piernas",        label:"Piernas" },
    { id:"hombros",        label:"Hombros" },
    { id:"espalda-baja",   label:"Espalda baja" }
  ];

  var INTENSITIES = ["baja","media","alta"];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var templates = {};
    DAYS.forEach(function(d){
      templates[d.id] = (EXERCISE_LIBRARY[d.id] || []).map(function(e){
        return { id: e.id, name: e.name, series: e.series, reps: e.reps, intensity: e.intensity, muscles: cloneMuscles(e.muscles) };
      });
    });
    return { templates: templates, logs: [] };
  }

  var data = loadData();
  var storageOK = true;
  try{
    localStorage.setItem("__test__","1");
    localStorage.removeItem("__test__");
  }catch(e){ storageOK = false; }

  function saveData(){
    if(!storageOK){
      showToast("No se puede guardar (almacenamiento no disponible)");
      return;
    }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ showToast("Error al guardar"); }
  }

  var currentDay = DAYS[0].id;
  var currentView = "train";
  var activeExerciseId = null;

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function todayISO(){
    var d = new Date();
    var m = (d.getMonth()+1).toString().padStart(2,"0");
    var day = d.getDate().toString().padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  // ---------- Confirm dialog (custom, no window.confirm) ----------

  function showConfirm(message, confirmLabel, onConfirm){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    var sheet = document.createElement("div");
    sheet.className = "modal-sheet";
    sheet.style.maxWidth = "360px";

    var msg = document.createElement("div");
    msg.className = "body-ex-name";
    msg.style.marginBottom = "14px";
    msg.textContent = message;

    var actions = document.createElement("div");
    actions.className = "modal-actions";
    actions.style.justifyContent = "flex-end";

    var cancelBtn = document.createElement("button");
    cancelBtn.className = "btn-secondary";
    cancelBtn.textContent = "Cancelar";
    var okBtn = document.createElement("button");
    okBtn.className = "btn-danger";
    okBtn.style.background = "var(--danger)";
    okBtn.style.color = "#ffffff";
    okBtn.style.border = "none";
    okBtn.textContent = confirmLabel;

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    sheet.appendChild(msg);
    sheet.appendChild(actions);
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);

    function close(){ document.body.removeChild(overlay); }
    cancelBtn.addEventListener("click", close);
    overlay.addEventListener("click", function(ev){ if(ev.target === overlay) close(); });
    okBtn.addEventListener("click", function(){ close(); onConfirm(); });
  }

  // ---------- Muscle helpers (shared by main diagram + editor) ----------

  function dedupeLabels(ids){
    var seen = {}, out = [];
    (ids || []).forEach(function(id){
      var label = ZONE_LABELS[id] || id;
      if(!seen[label]){ seen[label] = true; out.push(label); }
    });
    return out;
  }

  function musclesCaptionHTML(muscles, emptyText){
    if(!muscles) return emptyText;
    var lines = [];
    ["primary","secondary","tertiary"].forEach(function(tier){
      var ids = muscles[tier] || [];
      if(!ids.length) return;
      lines.push("<b>" + TIER_LABEL[tier] + ":</b> " + dedupeLabels(ids).join(", "));
    });
    return lines.length ? lines.join("<br>") : emptyText;
  }

  function clearZonesIn(rootId){
    var root = document.getElementById(rootId);
    if(!root) return;
    root.querySelectorAll(".zone").forEach(function(z){
      z.classList.remove("primary","secondary","tertiary");
    });
  }

  function applyMuscles(muscles, idSuffix){
    idSuffix = idSuffix || "";
    ["primary","secondary","tertiary"].forEach(function(tier){
      (muscles[tier] || []).forEach(function(id){
        var el = document.getElementById(id + idSuffix);
        if(el) el.classList.add(tier);
      });
    });
  }

  // ---------- Main body diagram ----------

  function renderDiagram(){
    clearZonesIn("mainBodies");

    var dayExs = data.templates[currentDay] || [];
    var ex = dayExs.filter(function(e){ return e.id === activeExerciseId; })[0];

    if(!ex){
      document.getElementById("bodyExName").textContent = "Tocá un ejercicio";
      document.getElementById("bodyMuscles").textContent = "para ver qué músculos trabaja";
      return;
    }

    document.getElementById("bodyExName").textContent = ex.name;
    applyMuscles(ex.muscles || {}, "");
    document.getElementById("bodyMuscles").innerHTML = musclesCaptionHTML(ex.muscles, "Sin músculos asignados. Editá el ejercicio para marcarlos.");
  }

  function selectExercise(id){
    activeExerciseId = id;
    renderDiagram();
    document.querySelectorAll(".card[data-ex-id]").forEach(function(c){
      c.classList.toggle("active", c.dataset.exId === id);
    });
  }

  // ---------- Exercise editor modal ----------

  var editorState = { mode:"add", dayId:null, exId:null, tier:"primary", muscles:{primary:[],secondary:[],tertiary:[]} };

  function cloneBodyWithSuffix(srcSvg, suffix){
    var clone = srcSvg.cloneNode(true);
    clone.removeAttribute("id");
    clone.querySelectorAll("[id]").forEach(function(el){
      el.id = el.id + suffix;
    });
    return clone;
  }

  function buildEditorBodies(){
    var frontSrc = document.getElementById("mainBodyFrontSvg");
    var backSrc = document.getElementById("mainBodyBackSvg");
    var frontClone = cloneBodyWithSuffix(frontSrc, "-ed");
    var backClone = cloneBodyWithSuffix(backSrc, "-ed");
    document.getElementById("editorBodyFrontMount").appendChild(frontClone);
    document.getElementById("editorBodyBackMount").appendChild(backClone);

    [frontClone, backClone].forEach(function(svg){
      svg.querySelectorAll(".zone").forEach(function(el){
        el.addEventListener("click", function(){
          var baseId = el.id.slice(0, -3); // strip "-ed"
          toggleEditorZone(baseId);
        });
      });
    });
  }

  function renderEditorBody(){
    clearZonesIn("editorBodyFrontMount");
    clearZonesIn("editorBodyBackMount");
    applyMuscles(editorState.muscles, "-ed");
    document.getElementById("editorCaption").innerHTML = musclesCaptionHTML(editorState.muscles, "Sin músculos asignados");
  }

  function toggleEditorZone(baseId){
    var m = editorState.muscles;
    var currentTier = null;
    ["primary","secondary","tertiary"].forEach(function(t){
      if(m[t].indexOf(baseId) !== -1) currentTier = t;
    });
    ["primary","secondary","tertiary"].forEach(function(t){
      m[t] = m[t].filter(function(x){ return x !== baseId; });
    });
    if(currentTier !== editorState.tier){
      m[editorState.tier].push(baseId);
    }
    renderEditorBody();
  }

  function setEditorTier(tier){
    editorState.tier = tier;
    document.querySelectorAll(".tier-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.tier === tier);
    });
  }

  function openEditor(mode, ex){
    editorState.mode = mode;
    editorState.dayId = currentDay;
    editorState.exId = ex ? ex.id : null;
    editorState.muscles = ex ? cloneMuscles(ex.muscles) : { primary:[], secondary:[], tertiary:[] };

    document.getElementById("editorTitle").textContent = mode === "add" ? "Nuevo ejercicio" : "Editar ejercicio";
    document.getElementById("editorName").value = ex ? ex.name : "";
    document.getElementById("editorDelete").classList.toggle("hidden", mode !== "edit");

    setEditorTier("primary");
    renderEditorBody();
    document.getElementById("editorOverlay").classList.remove("hidden");
  }

  function closeEditor(){
    document.getElementById("editorOverlay").classList.add("hidden");
  }

  function saveEditor(){
    var name = document.getElementById("editorName").value.trim();
    if(!name){
      showToast("Poné un nombre para el ejercicio");
      return;
    }
    if(!data.templates[editorState.dayId]) data.templates[editorState.dayId] = [];
    var list = data.templates[editorState.dayId];

    if(editorState.mode === "add"){
      var baseId = slug(name), id = baseId, n = 2;
      while(list.some(function(e){ return e.id === id; })){
        id = baseId + "-" + n;
        n++;
      }
      list.push({ id:id, name:name, series:3, reps:10, intensity:"media", muscles: cloneMuscles(editorState.muscles) });
      activeExerciseId = id;
    } else {
      var ex = list.filter(function(e){ return e.id === editorState.exId; })[0];
      if(ex){
        ex.name = name;
        ex.muscles = cloneMuscles(editorState.muscles);
      }
    }
    saveData();
    closeEditor();
    renderExercises();
  }

  function deleteFromEditor(){
    var list = data.templates[editorState.dayId] || [];
    var ex = list.filter(function(e){ return e.id === editorState.exId; })[0];
    var name = ex ? ex.name : "este ejercicio";
    showConfirm("¿Eliminar \"" + name + "\" de tu rutina?", "Eliminar", function(){
      data.templates[editorState.dayId] = list.filter(function(e){ return e.id !== editorState.exId; });
      saveData();
      closeEditor();
      renderExercises();
    });
  }

  document.getElementById("editorClose").addEventListener("click", closeEditor);
  document.getElementById("editorCancel").addEventListener("click", closeEditor);
  document.getElementById("editorSave").addEventListener("click", saveEditor);
  document.getElementById("editorDelete").addEventListener("click", deleteFromEditor);
  document.getElementById("editorTierRow").addEventListener("click", function(ev){
    var b = ev.target.closest(".tier-btn");
    if(!b) return;
    setEditorTier(b.dataset.tier);
  });
  document.getElementById("editorOverlay").addEventListener("click", function(ev){
    if(ev.target === this) closeEditor();
  });

  // ---------- Rendering ----------

  function renderTabs(){
    var wrap = document.getElementById("dayTabs");
    wrap.innerHTML = "";
    DAYS.forEach(function(d){
      var btn = document.createElement("button");
      btn.className = "tab-btn" + (d.id === currentDay ? " active" : "");
      btn.textContent = d.label;
      btn.addEventListener("click", function(){
        currentDay = d.id;
        var exs = data.templates[currentDay] || [];
        activeExerciseId = exs.length ? exs[0].id : null;
        renderTabs();
        renderExercises();
      });
      wrap.appendChild(btn);
    });
  }

  function renderExercises(){
    var day = DAYS.filter(function(d){ return d.id === currentDay; })[0];
    document.getElementById("dayTitle").textContent = day.label;
    var list = document.getElementById("exList");
    list.innerHTML = "";

    var exs = data.templates[currentDay] || [];
    if(exs.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Sin ejercicios. Agregá uno abajo.";
      list.appendChild(empty);
    }

    if(activeExerciseId === null || !exs.some(function(e){ return e.id === activeExerciseId; })){
      activeExerciseId = exs.length ? exs[0].id : null;
    }

    exs.forEach(function(ex){
      var card = document.createElement("div");
      card.className = "card" + (ex.id === activeExerciseId ? " active" : "");
      card.dataset.exId = ex.id;
      card.addEventListener("click", function(){
        selectExercise(ex.id);
      });

      var head = document.createElement("div");
      head.className = "ex-head";
      var name = document.createElement("div");
      name.className = "ex-name";
      name.textContent = ex.name;

      var actions = document.createElement("div");
      actions.className = "ex-actions";
      var editBtn = document.createElement("button");
      editBtn.className = "icon-btn";
      editBtn.textContent = "✎";
      editBtn.title = "Editar ejercicio";
      editBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        openEditor("edit", ex);
      });
      var del = document.createElement("button");
      del.className = "icon-btn";
      del.textContent = "✕";
      del.title = "Eliminar ejercicio";
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        showConfirm("¿Eliminar \"" + ex.name + "\" de tu rutina?", "Eliminar", function(){
          data.templates[currentDay] = data.templates[currentDay].filter(function(e){ return e.id !== ex.id; });
          saveData();
          renderExercises();
        });
      });
      actions.appendChild(editBtn);
      actions.appendChild(del);

      head.appendChild(name);
      head.appendChild(actions);
      card.appendChild(head);

      var row = document.createElement("div");
      row.className = "row";

      var fSeries = document.createElement("div");
      fSeries.className = "field";
      fSeries.innerHTML = '<label>Series</label>';
      var inSeries = document.createElement("input");
      inSeries.type = "number";
      inSeries.min = "1";
      inSeries.inputMode = "numeric";
      inSeries.value = ex.series;
      inSeries.addEventListener("click", function(ev){ ev.stopPropagation(); });
      inSeries.addEventListener("change", function(){
        ex.series = parseInt(inSeries.value, 10) || 1;
        saveData();
      });
      fSeries.appendChild(inSeries);

      var fReps = document.createElement("div");
      fReps.className = "field";
      fReps.innerHTML = '<label>Repeticiones</label>';
      var inReps = document.createElement("input");
      inReps.type = "number";
      inReps.min = "1";
      inReps.inputMode = "numeric";
      inReps.value = ex.reps;
      inReps.addEventListener("click", function(ev){ ev.stopPropagation(); });
      inReps.addEventListener("change", function(){
        ex.reps = parseInt(inReps.value, 10) || 1;
        saveData();
      });
      fReps.appendChild(inReps);

      row.appendChild(fSeries);
      row.appendChild(fReps);
      card.appendChild(row);

      var intWrap = document.createElement("div");
      intWrap.className = "field";
      intWrap.innerHTML = '<label>Intensidad (peso)</label>';
      var intRow = document.createElement("div");
      intRow.className = "intensity";
      INTENSITIES.forEach(function(level){
        var b = document.createElement("button");
        b.className = "int-btn" + (ex.intensity === level ? " active" : "");
        b.dataset.i = level;
        b.textContent = level.charAt(0).toUpperCase() + level.slice(1);
        b.addEventListener("click", function(ev){
          ev.stopPropagation();
          ex.intensity = level;
          saveData();
          renderExercises();
        });
        intRow.appendChild(b);
      });
      intWrap.appendChild(intRow);
      var hint = document.createElement("div");
      hint.className = "int-hint";
      hint.textContent = "Alta = más peso, menos repeticiones · Baja = menos peso, más repeticiones";
      intWrap.appendChild(hint);
      card.appendChild(intWrap);

      list.appendChild(card);
    });

    renderDiagram();
  }

  document.getElementById("addExBtn").addEventListener("click", function(){
    openEditor("add", null);
  });

  document.getElementById("saveDate").value = todayISO();

  document.getElementById("saveBtn").addEventListener("click", function(){
    var day = DAYS.filter(function(d){ return d.id === currentDay; })[0];
    var exs = data.templates[currentDay] || [];
    if(exs.length === 0){
      showToast("Agregá al menos un ejercicio");
      return;
    }
    var date = document.getElementById("saveDate").value || todayISO();
    var log = {
      id: uid(),
      dayId: currentDay,
      dayLabel: day.label,
      date: date,
      savedAt: Date.now(),
      exercises: exs.map(function(e){
        return { name: e.name, series: e.series, reps: e.reps, intensity: e.intensity };
      })
    };
    data.logs.unshift(log);
    saveData();
    showToast("Entrenamiento guardado ✓");
  });

  // ---------- History ----------

  function fmtDate(iso){
    var parts = iso.split("-");
    if(parts.length !== 3) return iso;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }

  function renderHistory(){
    var wrap = document.getElementById("historyList");
    wrap.innerHTML = "";
    if(data.logs.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Todavía no guardaste ningún entrenamiento.";
      wrap.appendChild(empty);
      return;
    }
    var sorted = data.logs.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.savedAt - a.savedAt;
    });
    sorted.forEach(function(log){
      var el = document.createElement("div");
      el.className = "log";

      var head = document.createElement("div");
      head.className = "log-head";
      head.innerHTML =
        '<div class="l-left"><div class="log-day">' + log.dayLabel + '</div>' +
        '<div class="log-date">' + fmtDate(log.date) + '</div></div>' +
        '<div class="icon-btn">▾</div>';
      head.addEventListener("click", function(){
        body.classList.toggle("open");
      });

      var body = document.createElement("div");
      body.className = "log-body";
      log.exercises.forEach(function(e){
        var row = document.createElement("div");
        row.className = "log-ex";
        row.innerHTML =
          '<div class="log-ex-name">' + e.name + '</div>' +
          '<div style="color:var(--text-dim)">' + e.series + '×' + e.reps + '</div>' +
          '<div class="pill ' + e.intensity + '">' + e.intensity + '</div>';
        body.appendChild(row);
      });
      var delBtn = document.createElement("button");
      delBtn.className = "log-del";
      delBtn.textContent = "Eliminar registro";
      delBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        showConfirm("¿Eliminar este registro del historial?", "Eliminar", function(){
          data.logs = data.logs.filter(function(l){ return l.id !== log.id; });
          saveData();
          renderHistory();
        });
      });
      body.appendChild(delBtn);

      el.appendChild(head);
      el.appendChild(body);
      wrap.appendChild(el);
    });
  }

  // ---------- Nav ----------

  document.getElementById("navTrain").addEventListener("click", function(){
    currentView = "train";
    document.getElementById("trainView").classList.remove("hidden");
    document.getElementById("historyView").classList.add("hidden");
    document.getElementById("navTrain").classList.add("active");
    document.getElementById("navHistory").classList.remove("active");
  });

  document.getElementById("navHistory").addEventListener("click", function(){
    currentView = "history";
    document.getElementById("trainView").classList.add("hidden");
    document.getElementById("historyView").classList.remove("hidden");
    document.getElementById("navHistory").classList.add("active");
    document.getElementById("navTrain").classList.remove("active");
    renderHistory();
  });

  // ---------- Export / Import ----------

  document.getElementById("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "mi-rutina-backup-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== "object" || !parsed.templates || !parsed.logs){
          throw new Error("formato inválido");
        }
        showConfirm("Esto reemplaza todos tus datos actuales por los del archivo. ¿Continuar?", "Importar", function(){
          data = parsed;
          saveData();
          activeExerciseId = null;
          renderExercises();
          renderHistory();
          showToast("Datos importados ✓");
        });
      }catch(e){
        showToast("Archivo inválido");
      }
      ev.target.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- Init ----------

  // ---------- Theme toggle ----------

  var THEME_KEY = "gymTrackerTheme_v1";

  function currentTheme(){
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  function updateThemeUI(){
    document.getElementById("themeToggle").textContent = currentTheme() === "dark" ? "☀️" : "🌙";
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta){
      var wash = getComputedStyle(document.documentElement).getPropertyValue("--top-wash").trim();
      if(wash) meta.content = wash;
    }
  }

  document.getElementById("themeToggle").addEventListener("click", function(){
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    updateThemeUI();
  });

  (function init(){
    updateThemeUI();
    buildEditorBodies();
    var exs = data.templates[currentDay] || [];
    activeExerciseId = exs.length ? exs[0].id : null;
    renderTabs();
    renderExercises();
  })();
})();
</script>

</body>
</html>
